<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <script src="./index.js" type="module"></script>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./display.css">
</head>
<body>


  <div class="content">
    <form action="GET" novalidate>
      <input type="text" name="query" id="query" placeholder="Search for a location... (Coordinates, name, or address)">
      <button id="send">Look up</button>
    </form>
    <main>
      <div class="wrap">
        <div class="header">
          <div class="name">
            <h1 id="main-addr"></h1>
            <h3 id="secondary-addr"></h3>
          </div>
          <div class="info">
            <h1 id="temp"></h1>
            <h3 id="feelslike"></h3>
            <h3 id="humidity"></h3>
            <h3 id="wind"></h3>
          </div>
        </div>
        <div class="footer">
          <h3 id="status"></h3>
          <p id="description"></p>
        </div>
      </div>
      <p></p>
    </main>
  </div>

</body>
</html>
